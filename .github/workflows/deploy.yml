name: Deploy to Fly.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Copy src
        run: cp -r rebanho-bot/src flyio/src
      - name: Deploy
        run: flyctl deploy --remote-only --no-cache --app rebanho-bot-ricci
        working-directory: flyio
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
